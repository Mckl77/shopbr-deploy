# ====================================================================
# Projet #7 - ShopBR - Kubernetes Deployment (sur AWS EKS)
# ====================================================================
#
# QU'EST-CE QUE KUBERNETES ?
# Docker permet de FAIRE TOURNER un conteneur. Kubernetes, lui, permet
# d'ORCHESTRER des dizaines ou centaines de conteneurs en production :
# il les redemarre automatiquement s'ils plantent, les multiplie
# automatiquement quand il y a beaucoup de trafic, repartit la charge
# entre eux, et gere les mises a jour sans interruption de service.
#
# Docker Compose (vu dans le dossier 01_docker) est suffisant pour un
# developpement local. Kubernetes prend le relais pour la PRODUCTION
# REELLE, a grande echelle, avec de la haute disponibilite.
#
# QU'EST-CE QU'UN "DEPLOYMENT" KUBERNETES ?
# C'est l'objet qui decrit COMMENT faire tourner notre application :
# quelle image Docker utiliser, combien de copies (on dit "replicas")
# faire tourner en parallele, comment gerer les mises a jour, et
# quelles limites de ressources (CPU/memoire) chaque copie peut utiliser.
#
# AWS EKS = "Elastic Kubernetes Service", le service manage d'Amazon
# qui fait tourner un cluster Kubernetes sans qu'on ait a gerer
# nous-memes l'infrastructure sous-jacente.
# ====================================================================

apiVersion: apps/v1   # version de l'API Kubernetes utilisee pour ce type d'objet
kind: Deployment       # le TYPE d'objet Kubernetes qu'on decrit ici
metadata:
  name: shopbr-api               # nom unique de ce Deployment dans le cluster
  namespace: shopbr               # un "namespace" est une sorte de dossier logique qui isole nos ressources des autres projets du cluster
  labels:
    app: shopbr-api
    version: "1.0.0"
spec:                              # "spec" = la specification, le coeur de la configuration
  # replicas = combien de copies IDENTIQUES de notre conteneur API
  # doivent tourner en permanence. On en met 2 minimum pour la HAUTE
  # DISPONIBILITE : si une copie plante ou si la machine qui l'heberge
  # tombe en panne, l'autre copie continue de repondre aux utilisateurs
  # pendant que Kubernetes relance automatiquement la copie defaillante.
  replicas: 2
  selector:
    # Le "selector" dit a Kubernetes : "les conteneurs geres par ce
    # Deployment sont ceux qui portent l'etiquette app=shopbr-api".
    # C'est ce qui relie ce Deployment aux "Pods" (conteneurs en cours
    # d'execution) qu'il controle.
    matchLabels:
      app: shopbr-api
  strategy:
    # Strategie de MISE A JOUR : comment Kubernetes remplace les
    # anciennes copies par les nouvelles quand on deploie une nouvelle
    # version de l'API.
    type: RollingUpdate   # "deploiement progressif", par opposition a tout arreter puis tout relancer (ce qui causerait une coupure de service)
    rollingUpdate:
      maxSurge: 1        # autorise 1 copie SUPPLEMENTAIRE temporaire pendant la mise a jour (donc jusqu'a 3 copies brievement)
      maxUnavailable: 0  # n'autorise JAMAIS 0 copie disponible : il y a toujours au moins 2 copies qui repondent, meme pendant une mise a jour
  template:
    # Le "template" decrit a quoi ressemble CHAQUE copie (chaque Pod)
    # que ce Deployment va creer.
    metadata:
      labels:
        app: shopbr-api
        version: "1.0.0"
    spec:
      containers:
        - name: shopbr-api
          # L'image Docker a utiliser. ECR = "Elastic Container
          # Registry", le service AWS qui stocke nos images Docker
          # (l'equivalent prive de Docker Hub). Cette image est celle
          # construite a partir de notre Dockerfile (cf 01_docker/).
          image: YOUR_AWS_ACCOUNT.dkr.ecr.sa-east-1.amazonaws.com/shopbr-api:latest
          imagePullPolicy: Always  # force Kubernetes a toujours verifier s'il existe une version plus recente de l'image avant de demarrer
          ports:
            - containerPort: 8000   # le port sur lequel l'API ecoute a l'interieur du conteneur
              name: http
          # Variables d'environnement, exactement comme dans
          # docker-compose.yml, mais avec une difference importante :
          # les informations sensibles (mots de passe, cles AWS) ne
          # sont JAMAIS ecrites en clair ici. Elles sont recuperees
          # depuis des "Secrets" Kubernetes (un coffre-fort chiffre
          # gere separement par l'equipe infrastructure).
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow-service:5000"
            - name: MODEL_NAME
              value: "shopbr_delay_risk"
            - name: MODEL_STAGE
              value: "Production"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:        # on va chercher la valeur dans un Secret Kubernetes, pas en clair ici
                  name: aws-credentials
                  key: access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: secret-access-key
            - name: REDSHIFT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redshift-credentials
                  key: password
          # "resources" definit combien de CPU et de memoire chaque
          # copie du conteneur peut utiliser. C'est une information
          # CRUCIALE pour Kubernetes : c'est sur cette base qu'il
          # decide ou placer chaque Pod dans le cluster, et c'est ce
          # que l'autoscaler (HPA, voir service.yaml) surveille pour
          # decider quand ajouter ou retirer des copies.
          resources:
            requests:
              # "requests" = ce que le conteneur est GARANTI d'obtenir
              # au minimum. Kubernetes reserve ces ressources des le
              # demarrage du Pod.
              cpu: "250m"      # "m" = millicores, 250m = un quart d'un coeur de processeur
              memory: "512Mi"  # 512 mebioctets de RAM garantis
            limits:
              # "limits" = le MAXIMUM que le conteneur peut consommer.
              # Si l'application essaie de depasser cette limite memoire,
              # Kubernetes la redemarre pour proteger les autres applications du cluster.
              cpu: "1000m"     # maximum 1 coeur complet
              memory: "1Gi"    # maximum 1 gibioctet de RAM
          # ── PROBES DE SANTE ─────────────────────────────────────
          # livenessProbe : Kubernetes appelle regulierement /health.
          # Si ca echoue plusieurs fois de suite (failureThreshold),
          # Kubernetes considere que le Pod est "mort" et le redemarre
          # automatiquement, sans intervention humaine.
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30  # attend 30s apres le demarrage avant le 1er test (le temps que le modele se charge)
            periodSeconds: 10        # teste toutes les 10 secondes ensuite
            failureThreshold: 3      # redemarre apres 3 echecs consecutifs
          # readinessProbe : difference subtile mais importante avec
          # livenessProbe. Si readinessProbe echoue, Kubernetes
          # n'arrete PAS le Pod, mais arrete de lui envoyer du trafic
          # utilisateur (le temps qu'il redevienne pret, par exemple
          # pendant un rechargement de modele).
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
      restartPolicy: Always  # Kubernetes redemarre toujours un conteneur qui s'arrete de maniere inattendue

---
# Le triple tiret "---" separe plusieurs objets Kubernetes a l'interieur
# d'un meme fichier YAML. Ici, on definit un second Deployment, pour le
# dashboard cette fois.

# ── DEPLOYMENT 2 : DASHBOARD DASH ───────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopbr-dashboard
  namespace: shopbr
  labels:
    app: shopbr-dashboard
spec:
  # Le dashboard n'a besoin que d'une seule copie : contrairement a
  # l'API qui doit absorber potentiellement beaucoup de requetes
  # automatisees, le dashboard n'est consulte que par un nombre limite
  # de personnes de l'equipe logistique. Pas besoin de haute
  # disponibilite aussi poussee ici.
  replicas: 1
  selector:
    matchLabels:
      app: shopbr-dashboard
  template:
    metadata:
      labels:
        app: shopbr-dashboard
    spec:
      containers:
        - name: shopbr-dashboard
          image: YOUR_AWS_ACCOUNT.dkr.ecr.sa-east-1.amazonaws.com/shopbr-api:latest
          # On reutilise la MEME image Docker que l'API (car elle
          # contient deja tout le code et toutes les dependances), mais
          # on remplace la commande de demarrage pour lancer le
          # dashboard plutot que l'API.
          command: ["python", "src/dashboard/app.py"]
          ports:
            - containerPort: 8050
          env:
            - name: API_URL
              # Le dashboard appelle l'API via le nom de son Service
              # Kubernetes (voir service.yaml), pas via une adresse IP fixe.
              value: "http://shopbr-api-service:8000"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
